<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon_io (1)/favicon.ico">
    <title>Login - Dunaka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/Style.css">
    <link rel="stylesheet" href="css/inicio_sesion.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-sign-in-alt"></i> Iniciar sesión</h1>
            <p>Ingresa con tu correo y contraseña para continuar en Dunaka.</p>
        </div>

        <form id="formLogin">
            <div class="form-floating">
                <input type="email" class="form-control" id="correo" placeholder="Correo electrónico" required>
                <label for="correo"><i class="fas fa-envelope"></i> Correo electrónico</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="contrasena" placeholder="Contraseña" required>
                <label for="contrasena"><i class="fas fa-lock"></i> Contraseña</label>
            </div>

            <button type="submit" class="btn btn-login">
                <i class="fas fa-arrow-right-to-bracket"></i> Ingresar
            </button>
        </form>

        <div class="login-link">
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
            <p><a href="recuperar_contrasena.html">¿Olvidaste tu contraseña?</a></p>
        </div>

        <div class="social-login">
            <p>O ingresa con:</p>
            <a href="#">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="#">
                <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a href="#">
                <i class="fa-brands fa-google"></i></i></i>
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
