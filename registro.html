<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon_io (1)/favicon.ico">
    <title>Registro - Dunaka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/Style.css">
    <style>
        body {
    background:#faf8f4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
        }
        .registro-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        .registro-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .registro-header h1 {
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .registro-header p {
            color: #666;
            font-size: 14px;
        }
        .form-floating {
            margin-bottom: 20px;
        }
        .form-control {
            border: none;
            border-bottom: 2px solid #ddd;
            border-radius: 0;
            background: transparent;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            box-shadow: none;
            border-bottom-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        .input-group-text {
            background: transparent;
            border: none;
            border-bottom: 2px solid #ddd;
            border-radius: 0;
        }
        .btn-registro {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-registro:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .form-check {
            margin-top: 20px;
        }
        .form-check-label {
            font-size: 14px;
            color: #666;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .social-login {
            text-align: center;
            margin-top: 20px;
        }
        .social-btn {
            display: inline-block;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 10px;
            line-height: 40px;
            text-align: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .social-btn:hover {
            transform: scale(1.1);
        }
        .social-btn.google {
            background: #db4437;
        }
        .social-btn.facebook {
            background: #4267b2;
        }
        .social-btn.twitter {
            background: #1da1f2;
        }
    </style>
</head>
<body>
    <div class="registro-container">
        <div class="registro-header">
            <h1><i class="fas fa-user-plus"></i> Registro</h1>
            <p>Únete a Dunaka y descubre lo mejor en moda</p>
        </div>

        <form id="formRegistro">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
                        <label for="nombre"><i class="fas fa-user"></i> Nombre</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="apellido" placeholder="Apellido" required>
                        <label for="apellido"><i class="fas fa-user"></i> Apellido</label>
                    </div>
                </div>
            </div>

            <div class="form-floating">
                <input type="email" class="form-control" id="correo" placeholder="Correo electrónico" required>
                <label for="correo"><i class="fas fa-envelope"></i> Correo electrónico</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="contrasena" placeholder="Contraseña" required>
                <label for="contrasena"><i class="fas fa-lock"></i> Contraseña</label>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="confirmarContrasena" placeholder="Confirmar contraseña" required>
                <label for="confirmarContrasena"><i class="fas fa-lock"></i> Confirmar contraseña</label>
            </div>
            <div class="form-floating">
                <input type="text" class="form-control" id="numero" placeholder="Número de teléfono" required>
                <label for="numero"><i class="fas fa-phone"></i> Número de teléfono</label>
            </div>
<div class="form-floating">
                <input type="date" class="form-control" id="diaNacimiento" placeholder="Día de nacimiento" required>
                <label for="diaNacimiento"><i class="fas fa-birthday-cake"></i> Día de nacimiento</label>
            </div>
            
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="terminos" required>
                <label class="form-check-label" for="terminos">
                    Acepto los <a href="#" style="color: #667eea;">términos y condiciones</a>
                </label>
            </div>

            <button type="submit" class="btn btn-registro">
                <i class="fas fa-user-plus"></i> Registrarse
            </button>
        </form>

        <div class="login-link">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>

        <div class="social-login">
            <p>O regístrate con:</p>
            <a href="#" class="social-btn google"><i class="fab fa-google"></i></a>
            <a href="#" class="social-btn facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-btn twitter"><i class="fab fa-twitter"></i></a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/registro.js"></script>
    <script src="js/loading.js"></script>
</body>
</html>
