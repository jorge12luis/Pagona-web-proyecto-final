<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon_io (1)/favicon.ico">

    <title>Dunaka Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../../public/css/Style.css">

    <link rel="stylesheet" href="../../public/css/admin.css">
</head>

<body>

<div class="admin-container">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>
            <i class="fa-solid fa-user-shield"></i>
            Admin
        </h2>

        <a href="#">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </a>

        <a href="#">
            <i class="fa-solid fa-box"></i>
            Productos
        </a>

        <a href="#">
            <i class="fa-solid fa-users"></i>
            Usuarios
        </a>

        <a href="#">
            <i class="fa-solid fa-cart-shopping"></i>
            Ventas
        </a>

        <a href="#">
            <i class="fa-solid fa-chart-pie"></i>
            Estadísticas
        </a>

        <a href="javascript:void(0)" onclick="cerrarSesion()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Cerrar sesión
        </a>

    </div>

    <!-- CONTENIDO -->

    <div class="main-content">

        <h1>
            Panel de Administración
        </h1>

        <p>
            Bienvenido administrador de DUNAKA
        </p>

        <!-- CARDS -->

        <div class="cards">

            <div class="card-admin">

                <i class="fa-solid fa-box"></i>

                <h3 id="totalProductos">
                    0
                </h3>

                <p>
                    Productos
                </p>

            </div>

            <div class="card-admin">

                <i class="fa-solid fa-users"></i>

                <h3 id="totalUsuarios">
                    0
                </h3>

                <p>
                    Usuarios
                </p>

            </div>

            <div class="card-admin">

                <i class="fa-solid fa-cart-shopping"></i>

                <h3 id="totalVentas">
                    0
                </h3>

                <p>
                    Ventas
                </p>

            </div>

            <div class="card-admin">

                <i class="fa-solid fa-dollar-sign"></i>

                <h3 id="ganancias">
                    $0
                </h3>

                <p>
                    Ganancias
                </p>

            </div>

        </div>

        <!-- CRUD PRODUCTOS -->

        <div class="tabla">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h3>
                    CRUD Productos
                </h3>

                <button class="btn-admin" onclick="agregarProducto()">
                    <i class="fa-solid fa-plus"></i>
                    Agregar producto
                </button>

            </div>

            <table class="table">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>

                </thead>

                <tbody id="tablaProductos">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="../../public/js/admin.js"></script>

</body>
</html>
