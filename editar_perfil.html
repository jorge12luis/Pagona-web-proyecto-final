<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Perfil</title>
    <link rel="stylesheet" href="css/editar_perfil.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <!-- LOGO -->
        <div class="logo">
            <h2>Editar Perfil</h2>
        </div>

        <!-- PERFIL -->
        <div class="perfil_superior">

        <!-- IMAGEN -->
        <div class="contenedor_imagen">

            <!-- SI HAY IMAGEN -->
            <img class="fotoPerfil" src="" alt="Foto de perfil">

            <!-- ICONO POR DEFECTO -->
            <div class="iconoUsuario">
             👤
            </div>

        </div>

        <!-- BOTON -->
        <div class="boton_agregar_foto">

        <button>Agregar Foto</button>

        </div>

        <!-- TEXTO -->
        <h3>Bienvenido, ah dunaka!</h3>

        </div>

        <!-- MENU -->
        <nav>
            <ul>
                <li>MI PERFIL</li>
                <li>MI FICHA</li>
                <li>AÑADIR FICHA</li>
                <li>SAVED SEARCHES</li>
                <li>LOG OUT</li>
            </ul>
        </nav>

    </aside>


    <!-- CONTENIDO -->
    <main class="main-content">
        <!-- CONTENIDO INTERNO -->
        <section class="content">

            <!-- FOTO PERFIL -->
            <section class="profile-photo-section">

                <div class="text">
                    <h1>Foto de perfil</h1>

                    <div class="contenedor_imagen">

                        <!--SI HAY IMAGEN-->
                        <img class="fotoPerfil" src="" alt="Foto de perfil">

                        <!-- ICONO POR DEFECTO -->
                        <div class="iconoUsuario">
                        👤
                        </div>

                     </div>

                    <p>
                        Sube tu foto de perfil,
                        un retrato en primer plano es ideal.
                    </p>
                </div>

                <div class="photo-box">

                    <center><img src="foto.jpg" alt="Foto Perfil"> <br><br></center>
                    </center><button>
                        SUBIR FOTO DE PERFIL
                    </button>
                    </center>

                </div>

            </section>


            <hr>


            <!-- DATOS USUARIO -->
            <section class="user-data">

                <div class="section-title">
                    <h2>Datos de usuario</h2>
                    <p>Añade tus datos de contacto.</p>
                </div>

                <form>

                    <div class="row">

                        <div class="input-group">
                            <label>Nombre</label>
                            <input type="text">
                        </div>

                        <div class="input-group">
                            <label>Teléfono</label>
                            <input type="text">
                        </div>

                    </div>


                    <div class="row">

                        <div class="input-group">
                            <label>Apellido</label>
                            <input type="text">
                        </div>

                        <div class="input-group">
                            <label>Teléfono móvil</label>
                            <input type="text">
                        </div>

                    </div>


                    <div class="row">

                        <div class="input-group">
                            <label>Correo</label>
                            <input type="email">
                        </div>

                        <div class="input-group">
                            <label>Skype</label>
                            <input type="text">
                        </div>

                    </div>

                </form>

            </section>


            <hr>


            <!-- REDES -->
            <section class="social-media">

                <div class="section-title">
                    <h2>Redes Sociales</h2>
                    <p>Añade tus redes sociales.</p>
                </div>

                <form>

                    <div class="row">

                        <div class="input-group">
                            <label>Facebook URL</label>
                            <input type="text">
                        </div>

                        <div class="input-group">
                            <label>Instagram URL</label>
                            <input type="text">
                        </div>

                    </div>


                    <div class="row">

                        <div class="input-group">
                            <label>Twitter URL</label>
                            <input type="text">
                        </div>

                        <div class="input-group">
                            <label>Pinterest URL</label>
                            <input type="text">
                        </div>

                    </div>

                </form>

            </section>

        </section>

    </main>

</body>
</html>
