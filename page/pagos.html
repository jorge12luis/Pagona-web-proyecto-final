<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago - DUNAKA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/pagos.css">
</head>

<body class="cuerpo">

<h1 class="titulo-pago">Finalizar compra</h1>

<section class="pago-container">

    <!-- 🧾 RESUMEN -->
    <div class="resumen">

        <h3>Tu pedido</h3>

        <div class="producto">
            <img src="img/bolso1.jpg">
            <div>
                <p>Bolso Elegante</p>
                <span>$150.000</span>
            </div>
        </div>

        <hr>

        <div class="total">
            <p>Total</p>
            <h4>$150.000</h4>
        </div>

    </div>

    <!-- 💳 MÉTODO DE PAGO -->
    <div class="metodo">

        <h3>Método de pago</h3>

        <form>

            <label class="metodo-item">
                <input type="radio" name="pago" checked>
                <span>💳 Tarjeta de crédito / débito</span>
            </label>

            <label class="metodo-item">
                <input type="radio" name="pago">
                <span>📱 Nequi</span>
            </label>

            <label class="metodo-item">
                <input type="radio" name="pago">
                <span>🏦 PSE</span>
            </label>

            <button class="btn-pagar">Pagar ahora</button>

        </form>

    </div>

</section>

</body>
</html>
