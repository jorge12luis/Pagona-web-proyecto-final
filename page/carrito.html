<h1 class="titulo-carrito">Tu Carrito</h1>

<section class="carrito-container">

    <!-- 🛍️ PRODUCTOS -->
    <div class="carrito-items">

        <div class="item">
            <img src="../img/bolso1.jpg">

            <div class="info">
                <h3>Bolso Elegante</h3>
                <p>$150.000</p>

                <div class="cantidad">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>

                <a href="#" class="eliminar">Eliminar</a>
            </div>
        </div>

        <div class="item">
            <img src="../img/bolso2.webp">

            <div class="info">
                <h3>Bolso Moderno</h3>
                <p>$180.000</p>

                <div class="cantidad">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>

                <a href="#" class="eliminar">Eliminar</a>
            </div>
        </div>

    </div>

    <!-- 💰 RESUMEN -->
    <div class="carrito-resumen">

        <h3>Resumen</h3>

        <div class="fila">
            <p>Subtotal</p>
            <span>$330.000</span>
        </div>

        <div class="fila">
            <p>Envío</p>
            <span>Gratis</span>
        </div>

        <hr>

        <div class="total">
            <p>Total</p>
            <h4>$330.000</h4>
        </div>

        <button class="btn-checkout" onclick="comprarAhora()">Finalizar compra</button>

    </div>

</section>
<script src="../js/carrito.js"></script>
    <script>

function comprarAhora(){

    // Revisar si el usuario inició sesión
    const usuario = localStorage.getItem("usuarioData");

    if(!usuario){

        alert("Debes iniciar sesión para continuar");

        window.location.href = "../login.html";

        return;
    }

    // Si ya inició sesión
window.location.href = "../informacionCliente.html";
}

</script>
