<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Favoritos</title>

    <link rel="stylesheet" href="../css/Style.css">
    <link rel="stylesheet" href="../css/loading.css">

    <style>

        .contenedorFavoritos{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
            gap: 20px;
            padding: 40px;
        }

        .cardFavorito{

    background: white;
    border-radius: 20px;
    overflow: hidden;

    box-shadow: 0px 4px 15px rgba(0,0,0,0.1);

    padding: 20px;

    display: flex;
    flex-direction: column;

    justify-content: space-between;

    height: 100%;
}

.cardFavorito img{

    width: 100%;
    height: 250px;

    object-fit: cover;

    border-radius: 15px;
}

.cardFavorito h2{

    min-height: 60px;
}
        .accionesFavoritos{
    text-align: center;
    margin: 20px;
}

.accionesFavoritos button{

    background: black;
    color: white;

    border: none;

    padding: 12px 20px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 16px;
}

.cardFavorito button{

    width: 100%;
    margin-top: 10px;

    background: crimson;
    color: white;

    border: none;

    padding: 10px;

    border-radius: 10px;

    cursor: pointer;
}   

    </style>

</head>
<body>

<h1 style="text-align:center;">
    ❤️ Mis favoritos
</h1>
<div class="accionesFavoritos">

    <button onclick="vaciarFavoritos()">
        Vaciar favoritos
    </button>

</div>

<div class="contenedorFavoritos"
id="contenedorFavoritos"></div>

<script src="../js/favoritos.js"></script>
<script src="../js/loading.js"></script>
</body>
</html>
