        <div class="nav-container">
            <div class="nav-brand-section">
                <a href="../index.html" class="logo-section">
                    <img src="/dunaka.png" alt="DUNAKA" class="logo-img">
                </a>
            </div>
            <div class="nav-text">
                <a href="../index.html">Inicio</a>
                <a href="../pages_nav/categorias.html">Categorias</a>

                <a href="../pages_nav/ediciones_limitadas.html">Ediciones Limitadas</a>
            </div>
            <div class="nav-icons-section">
                <a href="../page/favoritos.html" title="Favoritos"><i class="fa-solid fa-heart"></i></a>
                <a href="../page/micompra.html" title="Mis Compras"><i class="fa-solid fa-bag-shopping"></i></a>
                <a href="../page/carrito.html" class="cart-icon"><i class="fa-solid fa-cart-shopping"></i></a>

    <section class="producto-container">
        <div class="producto-img">
            <img id="productoImagen" src="../img/bolso10.jpg" alt="Producto Dunaka">
        </div>
        <div class="producto-info">
            <span id="productoEstado" class="estado">Nuevo</span>
            <h1 id="productoTitulo">Bolso Elegante DUNAKA</h1>
            <p id="productoDescripcion" class="descripcion">Diseño exclusivo, elaborado con materiales de alta calidad. Perfecto para mujeres auténticas que buscan elegancia.</p>
            <div class="precio">
                <h2 id="productoPrecio">$150.000</h2>
                <span id="productoExtra">o 3 cuotas sin interés</span>
            </div>
            <div id="productoStock" class="stock">Stock disponible</div>
            <div class="acciones">

<button class="btn-comprar" onclick="comprarAhora()">
    Comprar ahora
</button>            
<button class="btn-carrito" onclick="agregarCarrito()">
    Agregar al carrito
</button>

            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-section">
                <h3>Contáctanos</h3>
                <p>Email:
                    <a href="mailto:info@dunaka.com">info@dunaka.com</a>
                </p>
            </div>
        </div>
    </footer>
    <script src="../js/detalle_producto.js"></script>
    <script src="../js/carrito.js"></script>
    <script>

function comprarAhora(){

    // Revisar si el usuario inició sesión
    const usuario = localStorage.getItem("usuarioData");

    if(!usuario){

        alert("Debes iniciar sesión para continuar");

        window.location.href = "../login.html";

        return;
    }

    // Si ya inició sesión
    window.location.href = "../checkout.html";
}

</script>
<script>

function agregarCarrito(){

    const producto = {

        nombre: document.getElementById("productoTitulo").textContent,

        precio: parseInt(
            document.getElementById("productoPrecio")
            .textContent
            .replace("$","")
            .replace(/\./g,"")
        ),

        imagen: document.getElementById("productoImagen").src,

        cantidad: 1
    };

    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    const existe = carrito.find(item => item.nombre === producto.nombre);

    if(existe){

        existe.cantidad++;

    }else{

        carrito.push(producto);
    }

    localStorage.setItem("carrito", JSON.stringify(carrito));

    alert("Producto agregado al carrito");
}

</script>
</body>
