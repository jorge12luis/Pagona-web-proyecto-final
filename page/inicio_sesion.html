<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DUNAKA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">  
    <link rel="stylesheet" href="../css/inicio_sesion.css">
    <link rel="icon" href="/favicon_io (1)/favicon.ico">
</head>

<body class="cuerpo">

<section class="login-wrapper">

    <!-- LADO IZQUIERDO (LOGO / MARCA) -->
    <div class="login-brand">
        <img src="/dunaka.png" alt="DUNAKA">
    </div>

    <!-- LADO DERECHO (FORMULARIO) -->
    <div class="login-container">

        <div class="login-card">

            <h2 class="h2">Bienvenida</h2>
            <p class="subtexto">Accede a tu cuenta</p>

            <form>

                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" placeholder="ejemplo@email.com" required>
                </div>

                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" placeholder="••••••••" required>
                </div>

                <button class="btn-dunaka w-100">Iniciar sesión</button>

            </form>

            <p class="extra">
                ¿No tienes cuenta? <a href="#">Crear cuenta</a>
            </p>

        </div>

    </div>

</section>

</body>
</html>
