<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet"
    href="css/recuperar.css">

</head>

<body>

<div class="contenedor">

    <div class="card">

        <div class="titulo">

            <i class="fa-solid fa-key"></i>

            <h1>Recuperar contraseña</h1>

        </div>

        <p class="subtitulo">

            Ingresa tu correo electrónico para
            recuperar tu cuenta en Dunaka.

        </p>

        <form id="formBuscarCorreo">

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="correo"
                    placeholder="Correo electrónico"
                    required>

            </div>

            <button type="button" id="buscarCorreoBtn">

                <i class="fa-solid fa-magnifying-glass"></i>

                Buscar correo

            </button>

        </form>

        <form id="formRecuperar" class="hidden">

            <div class="input-box">

                <i class="fa-solid fa-key"></i>

                <input
                    type="text"
                    id="codigoRecuperacion"
                    placeholder="Código de recuperación"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="nuevaContrasena"
                    placeholder="Nueva contraseña"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmarContrasena"
                    placeholder="Confirmar contraseña"
                    required>

            </div>

            <button type="submit">

                <i class="fa-solid fa-key"></i>

                Cambiar contraseña

            </button>

        </form>

        <div id="mensaje"></div>

        <div class="volver">

            <a href="login.html">

                Volver al login

            </a>

        </div>

    </div>

</div>

<script src="js/recuperar.js"></script>

</body>
</html>
