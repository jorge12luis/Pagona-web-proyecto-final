
<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mis Compras</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

    background:#f5f5f5;

    padding:30px;

    font-family:Arial;

}

.compra{

    background:white;

    border-radius:15px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:0 5px 15px rgba(0,0,0,0.1);

}

.producto{

    border-top:1px solid #ddd;

    padding-top:10px;

    margin-top:10px;

}

.estado{

        padding:5px 12px;

        border-radius:12px;

        color:white;

        font-size:14px;

        display:inline-block;

        margin-top:8px;

    }

    .pendiente{

        background:#ff9f1c;

    }

    .enviado{

        background:#0d6efd;

    }

    .entregado{

        background:#198754;

    }

    .cancelado{

        background:#dc3545;

    }

    .estado-generico{

        background:#6c757d;

    }

    .pedido{

        margin-bottom:24px;

    }

    .pedido-header{

        display:flex;

        flex-wrap:wrap;

        justify-content:space-between;

        align-items:center;

    }

    .pedido-info{

        gap:12px;

        display:flex;

        flex-wrap:wrap;

        align-items:center;

    }

    .detalle-pedido{

        margin-top:18px;

        padding:18px;

        background:#f8f9fa;

        border-radius:12px;

    }

    .pedido-resumen{

        margin:0;

        line-height:1.5;

    }

    .btn-detalle{

        min-width:150px;

    }

</style>

</head>

<body>

<h1>Mis pedidos</h1>

<div id="contenedorCompras">

    <h3>Cargando compras...</h3>

</div>

<script>

async function cargarCompras(){

    const usuario =
    JSON.parse(localStorage.getItem("usuarioData"))
    ||
    JSON.parse(localStorage.getItem("usuario"));

    if(!usuario){

        window.location.href =
        "login.html";

        return;
    }

    const usuarioId =
    usuario.id || usuario.usuarioId || 1;

    const contenedor =
    document.getElementById(
        "contenedorCompras"
    );

    contenedor.innerHTML = `
        <div class="alert alert-secondary">
            Cargando compras...
        </div>
    `;

    try {
        const respuesta = await fetch(`http://localhost:3000/mis-compras/${usuarioId}`
        );

        if (!respuesta.ok) {
            throw new Error("No fue posible obtener los pedidos.");
        }

        const data = await respuesta.json();

        if(!data.ventas || data.ventas.length === 0){
            contenedor.innerHTML = `
                <div class="alert alert-info">
                    No tienes pedidos todavía 😢
                </div>
            `;
            return;
        }

        const ventasAgrupadas = {};

        data.ventas.forEach(item => {
            if(!ventasAgrupadas[item.id]){
                ventasAgrupadas[item.id] = {
                    fecha: item.fecha,
                    total: item.total,
                    estado: item.estado || "Pendiente",
                    productos: []
                };
            }
            ventasAgrupadas[item.id].productos.push(item);
        });

        contenedor.innerHTML = "";

        Object.entries(ventasAgrupadas)
        .forEach(([id, venta]) => {
            let productosHTML = "";

            venta.productos.forEach(producto => {
                productosHTML += `
                    <div class="producto">
                        <h5>${producto.nombre}</h5>
                        <p class="pedido-resumen">
                            Cantidad: <strong>${producto.cantidad}</strong>
                        </p>
                        <p class="pedido-resumen">
                            Subtotal: <strong>$${Number(producto.subtotal).toFixed(2)}</strong>
                        </p>
                    </div>
                `;
            });

            contenedor.innerHTML += `
                <div class="compra pedido">
                    <div class="pedido-header">
                        <div>
                            <h4>Pedido #${id}</h4>
                            <div class="pedido-info">
                                <p class="pedido-resumen">Fecha: <strong>${new Date(venta.fecha).toLocaleDateString()}</strong></p>
                                <p class="pedido-resumen">Total: <strong>$${Number(venta.total).toFixed(2)}</strong></p>
                            </div>
                        </div>
                        <button class="btn btn-dark btn-detalle" onclick="verDetalles(${id})">
                            Ver detalles
                        </button>
                    </div>
                    <span class="estado ${getEstadoClase(venta.estado)}">
                        ${venta.estado}
                    </span>
                    <div id="detalle-${id}" class="detalle-pedido" style="display:none;">
                        ${productosHTML}
                    </div>
                </div>
            `;
        });

    } catch (error) {
        contenedor.innerHTML = `
            <div class="alert alert-danger">
                Error cargando pedidos: ${error.message}
            </div>
        `;
    }
}

function getEstadoClase(estado){
    const valor = String(estado || "").toLowerCase();
    if(valor.includes("pend")) return "pendiente";
    if(valor.includes("entreg")) return "entregado";
    if(valor.includes("envi") || valor.includes("ship")) return "enviado";
    if(valor.includes("cancel")) return "cancelado";
    return "estado-generico";
}

function verDetalles(id){
    const detalle = document.getElementById(`detalle-${id}`);
    if (!detalle) return;
    detalle.style.display = detalle.style.display === "none" ? "block" : "none";
}

cargarCompras();

</script>

</body>
</html>
