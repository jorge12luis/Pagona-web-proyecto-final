<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Favoritos</title>

    <link rel="stylesheet" href="../css/Style.css">

    <style>

        .contenedorFavoritos{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
            gap: 20px;
            padding: 40px;
        }

        .cardFavorito{

    background: white;
    border-radius: 20px;
    overflow: hidden;

    box-shadow: 0px 4px 15px rgba(0,0,0,0.1);

    padding: 20px;

    display: flex;
    flex-direction: column;

    justify-content: space-between;

    height: 100%;
}

.cardFavorito img{

    width: 100%;
    height: 250px;

    object-fit: cover;

    border-radius: 15px;
}

.cardFavorito h2{

    min-height: 60px;
}
        .accionesFavoritos{
    text-align: center;
    margin: 20px;
}

.accionesFavoritos button{

    background: black;
    color: white;

    border: none;

    padding: 12px 20px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 16px;
}

.cardFavorito button{

    width: 100%;
    margin-top: 10px;

    background: crimson;
    color: white;

    border: none;

    padding: 10px;

    border-radius: 10px;

    cursor: pointer;
}   

    </style>

</head>
<body>
    <nav class="navegacion-premium">
    <div class="nav-container">
        <div class="nav-brand-section">
            <a href="index.html" class="logo-section">
               <img src="dunaka.png" alt="DUNAKA" class="logo-img">
             </a>
            </div>

            <div class="nav-text">
                <a href="index.html">Inicio</a>
                <a href="pages_nav/categorias.html">Categorias</a>
                <a href="pages_nav/favoritos.html">Favoritos</a>
                <a href="pages_nav/micompra.html">Mis Compras</a>
                <a href="pages_nav/carrito.html">Carrito</a>

            </div>
        <div class="nav-icons-section">
            <div class="user-menu-custom">
                <span class="user-name"><i class="fa-solid fa-user"></i></span>
                <div class="dropdown-content right">
                    <a href="perfil.html">Mi perfil</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<h1 style="text-align:center;">
    ❤️ Mis favoritos
</h1>
<div class="accionesFavoritos">

    <button onclick="vaciarFavoritos()">
        Vaciar favoritos
    </button>

</div>

<div class="contenedorFavoritos"
id="contenedorFavoritos"></div>
<script>

// Verificar sesión
const usuario =
JSON.parse(localStorage.getItem("usuarioData"))
||
JSON.parse(localStorage.getItem("usuario"));

if(!usuario){

    alert(
        "Debes iniciar sesión para ver tus favoritos."
    );

    window.location.href =
    "../login.html";

}

</script>

<script src="../js/favoritos.js"></script>

<script src="../js/favoritos.js"></script>
