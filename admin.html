<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon_io (1)/favicon.ico">

    <title>Dunaka Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/Style.css">

    <style>

        body{
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .admin-container{
            display: flex;
            min-height: 100vh;
        }

        .sidebar{
            width: 260px;
            background: #111827;
            color: white;
            padding: 30px 20px;
        }

        .sidebar h2{
            font-weight: bold;
            margin-bottom: 40px;
        }

        .sidebar a{
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: .3s;
        }

        .sidebar a:hover{
            background: #374151;
        }

        .main-content{
            flex: 1;
            padding: 30px;
        }

        .cards{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card-admin{
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
        }

        .card-admin i{
            font-size: 35px;
            margin-bottom: 15px;
            color: #667eea;
        }

        .card-admin h3{
            font-size: 22px;
            font-weight: bold;
        }

        .tabla{
            background: white;
            margin-top: 40px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
        }

        .btn-admin{
            background: linear-gradient(135deg,#667eea,#764ba2);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
        }

        .btn-admin:hover{
            opacity: .9;
        }

    </style>
</head>

<body>

<script>

const rol = localStorage.getItem("rolUsuario");

if(rol !== "admin"){

    alert("No tienes permisos");

    window.location.href = "index.html";
}

</script>

<div class="admin-container">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>
            <i class="fa-solid fa-user-shield"></i>
            Admin
        </h2>

        <a href="#">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </a>

        <a href="#">
            <i class="fa-solid fa-box"></i>
            Productos
        </a>

        <a href="#">
            <i class="fa-solid fa-users"></i>
            Usuarios
        </a>

        <a href="#">
            <i class="fa-solid fa-cart-shopping"></i>
            Ventas
        </a>

        <a href="#">
            <i class="fa-solid fa-chart-pie"></i>
            Estadísticas
        </a>

        <a href="#" onclick="cerrarSesion()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Cerrar sesión
        </a>

    </div>

    <!-- CONTENIDO -->

    <div class="main-content">

        <h1>
            Panel de Administración
        </h1>

        <p>
            Bienvenido administrador de DUNAKA
        </p>

        <!-- CARDS -->

        <div class="cards">

            <div class="card-admin">

                <i class="fa-solid fa-box"></i>

                <h3 id="totalProductos">
                    0
                </h3>

                <p>
                    Productos
                </p>

            </div>

            <div class="card-admin">

                <i class="fa-solid fa-users"></i>

                <h3 id="totalUsuarios">
                    0
                </h3>

                <p>
                    Usuarios
                </p>

            </div>

            <div class="card-admin">

                <i class="fa-solid fa-cart-shopping"></i>

                <h3 id="totalVentas">
                    0
                </h3>

                <p>
                    Ventas
                </p>

            </div>

            <div class="card-admin">

                <i class="fa-solid fa-dollar-sign"></i>

                <h3 id="ganancias">
                    $0
                </h3>

                <p>
                    Ganancias
                </p>

            </div>

        </div>

        <!-- CRUD PRODUCTOS -->

        <div class="tabla">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h3>
                    CRUD Productos
                </h3>

                <button class="btn-admin">
                    <i class="fa-solid fa-plus"></i>
                    Agregar producto
                </button>

            </div>

            <table class="table">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td>1</td>

                        <td>Bolso Manhattan</td>

                        <td>$120.000</td>

                        <td>15</td>

                        <td>

                            <button class="btn btn-warning btn-sm">
                                Editar
                            </button>

                            <button class="btn btn-danger btn-sm">
                                Eliminar
                            </button>

                        </td>

                    </tr>

                    <tr>

                        <td>2</td>

                        <td>Mochila Urban</td>

                        <td>$145.000</td>

                        <td>8</td>

                        <td>

                            <button class="btn btn-warning btn-sm">
                                Editar
                            </button>

                            <button class="btn btn-danger btn-sm">
                                Eliminar
                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

function cerrarSesion(){

    const confirmar = confirm(
        "¿Seguro que deseas cerrar sesión?"
    );

    if(confirmar){

        localStorage.clear();

        window.location.href = "login.html";
    }

}

</script>

</body>
</html>
