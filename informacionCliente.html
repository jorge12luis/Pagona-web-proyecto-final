<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon_io (1)/favicon.ico">

    <title>Registro - Dunaka</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet"
    href="css/Style.css">

    <link rel="stylesheet"
    href="css/registro.css">
</head>

<body>

<div class="registro-container">

    <div class="registro-header">

        <h1>
            <i class="fas fa-user-plus"></i>
            Información 
        </h1>

        <p>
            Completa tu información para realizar compras
            rápidas y seguras en DUNAKA
        </p>

    </div>
<form id="formRegistro">

    <!-- DATOS PERSONALES -->
    <div class="titulo-seccion">
        Información personal
    </div>

    <div class="row">

        <div class="col-md-6">

            <div class="form-floating">

                <input
                type="text"
                class="form-control"
                id="nombre"
                required>

                <label>
                    Nombre
                </label>

            </div>

        </div>

        <div class="col-md-6">

            <div class="form-floating">

                <input
                type="text"
                class="form-control"
                id="apellido"
                required>

                <label>
                    Apellido
                </label>

            </div>

        </div>

    </div>

    <div class="form-floating">

        <input
        type="email"
        class="form-control"
        id="correo"
        required>

        <label>
            Correo electrónico
        </label>

    </div>

    <div class="form-floating">

        <input
        type="text"
        class="form-control"
        id="numero"
        required>

        <label>
            Número de teléfono
        </label>

    </div>

    <!-- DIRECCIÓN -->
    <div class="titulo-seccion">
        Dirección de envío
    </div>

    <div class="form-floating">

        <input
        type="text"
        class="form-control"
        id="direccion"
        required>

        <label>
            Dirección
        </label>

    </div>

    <div class="row">

        <div class="col-md-6">

            <div class="form-floating">

                <input
                type="text"
                class="form-control"
                id="ciudad"
                required>

                <label>
                    Ciudad
                </label>

            </div>

        </div>

        <div class="col-md-6">

            <div class="form-floating">

                <input
                type="text"
                class="form-control"
                id="departamento"
                required>

                <label>
                    Departamento
                </label>

            </div>

        </div>

    </div>

    <button
    type="submit"
    class="btn btn-registro">

        Ir a pagar

    </button>

</form>





</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="./js/registro.js"></script>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>

<script>

document.getElementById("formRegistro").addEventListener("submit", async function(e){

    e.preventDefault();

    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    let total = 0;

    carrito.forEach(producto => {

        total += Number(producto.precio) * Number(producto.cantidad);

    });

    // CENTAVOS
    const amountInCents = String(total * 100);

    const currency = "COP";

    const reference = "DUNAKA-" + Date.now();

    const publicKey = "pub_test_TMtzLyFRKH2ulwbO8kRGX9ajyXvQOpAG";

    const integritySecret = "test_integrity_SI1ltUwxeAkxE6lOToI0JOXXqDKVToVY";

    // TOKEN NUEVO
    const respuesta = await fetch(
        `https://sandbox.wompi.co/v1/merchants/${publicKey}`
    );

    const data = await respuesta.json();

    const acceptanceToken =
        data.data.presigned_acceptance.acceptance_token;

    // FIRMA EXACTA WOMPI
    const signature = CryptoJS.SHA256(
        reference +
        amountInCents +
        currency +
        integritySecret
    ).toString();

    console.log(signature);

    // URL WOMPI
    const url =
    `https://checkout.wompi.co/p/?public-key=${publicKey}&currency=${currency}&amount-in-cents=${amountInCents}&reference=${reference}&signature:integrity=${signature}&acceptance-token=${acceptanceToken}`;
    
    // USUARIO LOGUEADO
const usuario =
JSON.parse(localStorage.getItem("usuarioData"))
||
JSON.parse(localStorage.getItem("usuario"));

// GUARDAR COMPRA
await fetch("http://localhost:3000/guardar-compra", {

    method: "POST",

    headers: {
        "Content-Type": "application/json"
    },

    body: JSON.stringify({

        usuarioId: 1, // USUARIO GOOGLE

        carrito: carrito,

        total: total

    })

});

    window.location.href = url;

});

</script>
</body>
</html>
