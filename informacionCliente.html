<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon_io (1)/favicon.ico">

    <title>Registro - Dunaka</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet"
    href="css/Style.css">

<style>

body{

    background:#faf8f4;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:'Arial',sans-serif;

    padding:40px 20px;
}

.registro-container{

    background:rgba(255,255,255,0.95);

    border-radius:20px;

    box-shadow:0 15px 35px rgba(0,0,0,0.1);

    padding:40px;

    max-width:600px;

    width:100%;

    backdrop-filter:blur(10px);
}

.registro-header{

    text-align:center;

    margin-bottom:30px;
}

.registro-header h1{

    color:#333;

    font-weight:bold;

    margin-bottom:10px;
}

.registro-header p{

    color:#666;

    font-size:14px;
}

.form-floating{

    margin-bottom:20px;
}

.form-control{

    border:none;

    border-bottom:2px solid #ddd;

    border-radius:0;

    background:transparent;

    transition:0.3s;
}

.form-control:focus{

    box-shadow:none;

    border-bottom-color:#667eea;

    background:rgba(102,126,234,0.1);
}

.btn-registro{

    background:linear-gradient(
    135deg,
    #667eea 0%,
    #764ba2 100%);

    border:none;

    border-radius:50px;

    padding:14px;

    font-weight:bold;

    color:white;

    width:100%;

    transition:0.3s;
}

.btn-registro:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 25px rgba(102,126,234,0.3);
}

.form-check{

    margin-top:15px;
}

.login-link{

    text-align:center;

    margin-top:20px;
}

.login-link a{

    color:#667eea;

    text-decoration:none;

    font-weight:bold;
}

.social-login{

    text-align:center;

    margin-top:25px;
}

.social-btn{

    display:inline-block;

    width:40px;

    height:40px;

    border-radius:50%;

    margin:0 10px;

    line-height:40px;

    text-align:center;

    color:white;

    text-decoration:none;

    transition:0.3s;
}

.social-btn:hover{

    transform:scale(1.1);
}

.google{
    background:#db4437;
}

.facebook{
    background:#4267b2;
}

.twitter{
    background:#1da1f2;
}

.titulo-seccion{

    margin-top:30px;

    margin-bottom:15px;

    font-size:18px;

    font-weight:bold;

    color:#444;

    border-left:4px solid #667eea;

    padding-left:10px;
}

</style>

</head>

<body>

<div class="registro-container">

    <div class="registro-header">

        <h1>
            <i class="fas fa-user-plus"></i>
            Información 
        </h1>

        <p>
            Completa tu información para realizar compras
            rápidas y seguras en DUNAKA
        </p>

    </div>
<form id="formRegistro">

    <!-- DATOS PERSONALES -->
    <div class="titulo-seccion">
        Información personal
    </div>

    <div class="row">

        <div class="col-md-6">

            <div class="form-floating">

                <input
                type="text"
                class="form-control"
                id="nombre"
                required>

                <label>
                    Nombre
                </label>

            </div>

        </div>

        <div class="col-md-6">

            <div class="form-floating">

                <input
                type="text"
                class="form-control"
                id="apellido"
                required>

                <label>
                    Apellido
                </label>

            </div>

        </div>

    </div>

    <div class="form-floating">

        <input
        type="email"
        class="form-control"
        id="correo"
        required>

        <label>
            Correo electrónico
        </label>

    </div>

    <div class="form-floating">

        <input
        type="text"
        class="form-control"
        id="numero"
        required>

        <label>
            Número de teléfono
        </label>

    </div>

    <!-- DIRECCIÓN -->
    <div class="titulo-seccion">
        Dirección de envío
    </div>

    <div class="form-floating">

        <input
        type="text"
        class="form-control"
        id="direccion"
        required>

        <label>
            Dirección
        </label>

    </div>

    <div class="row">

        <div class="col-md-6">

            <div class="form-floating">

                <input
                type="text"
                class="form-control"
                id="ciudad"
                required>

                <label>
                    Ciudad
                </label>

            </div>

        </div>

        <div class="col-md-6">

            <div class="form-floating">

                <input
                type="text"
                class="form-control"
                id="departamento"
                required>

                <label>
                    Departamento
                </label>

            </div>

        </div>

    </div>

    <button
    type="submit"
    class="btn btn-registro">

        Ir a pagar

    </button>

</form>





</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="./js/registro.js"></script>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>

<script>

document.getElementById("formRegistro").addEventListener("submit", async function(e){

    e.preventDefault();

    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    let total = 0;

    carrito.forEach(producto => {

        total += Number(producto.precio) * Number(producto.cantidad);

    });

    // CENTAVOS
    const amountInCents = String(total * 100);

    const currency = "COP";

    const reference = "DUNAKA-" + Date.now();

    const publicKey = "pub_test_TMtzLyFRKH2ulwbO8kRGX9ajyXvQOpAG";

    const integritySecret = "test_integrity_SI1ltUwxeAkxE6lOToI0JOXXqDKVToVY";

    // TOKEN NUEVO
    const respuesta = await fetch(
        `https://sandbox.wompi.co/v1/merchants/${publicKey}`
    );

    const data = await respuesta.json();

    const acceptanceToken =
        data.data.presigned_acceptance.acceptance_token;

    // FIRMA EXACTA WOMPI
    const signature = CryptoJS.SHA256(
        reference +
        amountInCents +
        currency +
        integritySecret
    ).toString();

    console.log(signature);

    // URL WOMPI
    const url =
    `https://checkout.wompi.co/p/?public-key=${publicKey}&currency=${currency}&amount-in-cents=${amountInCents}&reference=${reference}&signature:integrity=${signature}&acceptance-token=${acceptanceToken}`;
    
    // USUARIO LOGUEADO
const usuario =
JSON.parse(localStorage.getItem("usuarioData"))
||
JSON.parse(localStorage.getItem("usuario"));

// GUARDAR COMPRA
await fetch("http://localhost:3000/guardar-compra", {

    method: "POST",

    headers: {
        "Content-Type": "application/json"
    },

    body: JSON.stringify({

        usuarioId: 1, // USUARIO GOOGLE

        carrito: carrito,

        total: total

    })

});

    window.location.href = url;

});

</script>
</body>
</html>
